<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="لوحة الإدارة">
  <!--
    The panel's tab icon.

    Deliberately not the store's. Whoever runs this shop has both open at once
    all day — the panel in one tab and the storefront in another, often the
    same page in two states — and two identical favicons means picking the
    wrong tab to paste a licence key into.

    So: the same brand green, inverted. A dark panel with a light mark reads as
    "the back of the shop" at sixteen pixels without needing to be legible as
    anything in particular.
  -->
  <rect width="32" height="32" rx="7" fill="#0a544b" />
  <g fill="none" stroke="#7fd6c7" stroke-width="2.6" stroke-linecap="round">
    <!-- Three rows, which is what a list of work looks like small. -->
    <path d="M9 11 H23" />
    <path d="M9 16 H23" />
    <path d="M9 21 H17" />
  </g>
</svg>
