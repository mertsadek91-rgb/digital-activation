name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. gitleaks lists the pull request's commits, which needs
# pull-requests: read; nothing here writes to the repository.
permissions:
  contents: read
  pull-requests: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # prisma.config.ts resolves the migrate URL even for `prisma generate`,
  # which never connects. A placeholder lets the jobs without a database
  # generate the client; the schema job overrides it with its real Postgres.
  DATABASE_URL_MIGRATE: postgresql://ci:ci@localhost:5432/ci

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # Agent OS (agent-os/). The evals prove the guardrails, routing, decision
      # rights and opportunity rules still hold; pm:check fails if canonical
      # state is invalid or a committed projection (index, front matter,
      # dashboard data) no longer matches the event log.
      - name: Agent OS evals
        run: pnpm agent-os:eval
      - name: Project state is consistent
        run: pnpm pm:check

      # The API's OpenAPI document, for the storefront and admin to generate
      # clients from. Built from Nest's preview mode, so it needs no database;
      # published rather than committed, so it is never stale.
      - name: OpenAPI document
        run: pnpm --filter @da/api openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json
          if-no-files-found: error

  schema:
    name: Schema and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same major as docker-compose and Coolify: a migration that only
        # works on one of them should fail here, not in production.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: da
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: da_main
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U da -d da_main"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL_MIGRATE: postgresql://da:ci@localhost:5432/da_main?schema=public
      DATABASE_URL: postgresql://da:ci@localhost:5432/da_main?schema=public
      DATABASE_URL_VAULT: postgresql://da:ci@localhost:5432/da_main?schema=vault
      # An empty database Prisma replays the migrations into for the drift
      # check. Prisma 7 reads it from prisma.config.ts, not a CLI flag.
      SHADOW_DATABASE_URL: postgresql://da:ci@localhost:5432/da_shadow?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the seed, which imports the generated client.
      - run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @da/db migrate:deploy

      # Catches the classic failure of editing the schema and forgetting the
      # migration: the committed migrations must reproduce the schema exactly.
      - name: Fail on schema drift
        run: |
          PGPASSWORD=ci psql -h localhost -U da -d da_main -c 'CREATE DATABASE da_shadow'
          pnpm --filter @da/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema \
            --exit-code
        continue-on-error: false

      - name: Seed
        run: pnpm db:seed

      # Checkout, payment webhooks, fulfilment and cart recovery against this
      # job's Postgres, after the seed so they run on a store with data in it.
      # The suite creates its own uniquely named catalogue and never calls
      # Stripe or a mail server. Owner connection for both clients: the role
      # split is not what these tests are about (see global-setup.ts).
      - name: Build the API's workspace dependencies
        run: pnpm turbo run build --filter=@da/api^...
      - name: Integration tests
        run: pnpm --filter @da/api test:int
        env:
          TEST_DATABASE_URL: postgresql://da:ci@localhost:5432/da_main?schema=public

  budget:
    name: Performance budget
    runs-on: ubuntu-latest
    needs: verify
    # A real API on a real database, so the product, category and cart pages
    # render what a shopper sees rather than their empty states. The same
    # Postgres major as the schema job; Redis because the API's rate limits
    # and the readiness probe expect one.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: da
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: da_main
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U da -d da_main"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Built and served as production, so the SEO audits measure what a
      # crawler sees. Without it the store renders noindex (the staging
      # brake in @da/seo) and Lighthouse fails "blocked from indexing" on
      # every run for a reason that is working as designed.
      NEXT_PUBLIC_SITE_URL: https://digital-activation.com
      # Where the storefront finds the API, on the server and in the browser.
      # Both are also the code's defaults; set so the job does not depend on that.
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DATABASE_URL_MIGRATE: postgresql://da:ci@localhost:5432/da_main?schema=public
      DATABASE_URL: postgresql://da:ci@localhost:5432/da_main?schema=public
      DATABASE_URL_VAULT: postgresql://da:ci@localhost:5432/da_main?schema=vault
    # The resource-count budgets (lighthouserc.json) were first written
    # before this job had ever run. They are now the first measured values
    # plus a little headroom (20 scripts, 2 stylesheets, 60 requests; CI
    # measured 15/2/50 and a local run 18/2/53), so
    # they catch a regression rather than failing on the framework's floor.
    # unused-javascript stays a warning: the shared bundle carries code for
    # pages other than the one measured, which Lighthouse counts as unused.
    #
    # Mobile (Lighthouse's default, simulated slow 4G and 4x CPU) and desktop
    # run as two steps over the same five pages. The URLs carry `ff=mobile`
    # or `ff=desktop` only so lighthouserc.json can hold one budget per form
    # factor in its assertMatrix; no page reads the parameter. The cart is
    # opened as `/cart?add=<fixture variant>`, the renewal-link form, so it is
    # measured with a line in it rather than as its empty state. Lighthouse
    # resets storage before every run, so each run starts a fresh cart.
    # The Lighthouse CLI is pinned to an exact version: a new audit or a
    # changed scoring curve should arrive as a pull request, not as a red run.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @da/db migrate:deploy
      # Reference data (currencies, navigation, the Organization block), then
      # a fixed two-product catalogue whose slugs lighthouserc.json lists.
      # The fixture refuses any database that is not on this machine.
      - name: Seed
        run: pnpm db:seed
      - name: CI catalogue fixture
        run: pnpm --filter @da/db ci-fixture

      - name: Build the API
        run: pnpm turbo run build --filter=@da/api

      # CI-only dummy values, fixed like the integration suite's
      # (apps/api/src/integration/env.ts): nothing here is a real secret, and
      # a fixed value keeps one run like the next. NODE_ENV=development for
      # the API alone, because the capture mail transport and the local KEK
      # are refused in production; the storefront is still built and served
      # as production.
      #
      # Nothing here can email anyone, three times over. CRON_JOBS=off
      # registers none of the sweeps (cart recovery, renewals, review invites,
      # back-in-stock, stranded orders), as the integration harness stops them,
      # so none fires mid-audit either; MAIL_TRANSPORT=capture writes a message
      # to a file and has no network path; and the database holds no customer,
      # order or subscriber, only the seed's reference data and the fixture.
      # No SMTP or Resend credential exists in this job (no .env on the runner,
      # none passed). FX_REFRESH=off keeps the API off the exchange-rate feed.
      - name: Start the API
        working-directory: apps/api
        env:
          NODE_ENV: development
          STOREFRONT_URL: http://localhost:3000
          ADMIN_URL: http://localhost:3001
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-lighthouse-only-not-a-secret-access
          JWT_REFRESH_SECRET: ci-lighthouse-only-not-a-secret-refresh
          KEK_PROVIDER: local
          # 32 zero bytes, base64: a dummy KEK for a vault that holds nothing.
          KEK_LOCAL_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MAIL_TRANSPORT: capture
          MAIL_FROM_TRANSACTIONAL: orders@example.com
          MAIL_FROM_MARKETING: news@example.com
          STORE_TIMEZONE: UTC
          CRON_JOBS: 'off'
          FX_REFRESH: 'off'
          AUTO_DELIVERY: 'off'
          LOG_LEVEL: warn
        run: |
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health/ready; then
              echo
              # The three audited pages' data: fail here, with the API log,
              # rather than as a Lighthouse score on a 404 page.
              curl -fsS -o /dev/null "http://localhost:4000/v1/catalog/products/ci-fixture-product?locale=ar&currency=USD"
              curl -fsS -o /dev/null "http://localhost:4000/v1/catalog/collections/ci-fixture-category?locale=ar&currency=USD"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The API did not become ready within 60 seconds."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      # Through turbo, so the workspace packages the storefront imports
      # (@da/ui, @da/seo, @da/contracts, @da/i18n) are built first; a bare
      # `next build` finds no dist for them.
      - run: pnpm turbo run build --filter=@da/storefront

      # The legacy store shipped 104 stylesheets, 93 scripts and 226 requests,
      # and finished loading in 17.4 seconds. This job is why that cannot come
      # back one pull request at a time: exceeding the budget fails the build,
      # it does not open a ticket.
      - name: Lighthouse CI (mobile)
        id: lhci-mobile
        run: npx --yes @lhci/cli@0.15.1 autorun
        working-directory: apps/storefront
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Runs even when the mobile step failed, so one red run reports both
      # form factors instead of hiding the second behind the first. The job
      # still fails if either does.
      - name: Lighthouse CI (desktop)
        if: ${{ !cancelled() && (steps.lhci-mobile.outcome == 'success' || steps.lhci-mobile.outcome == 'failure') }}
        run: >-
          npx --yes @lhci/cli@0.15.1 autorun
          --collect.settings.preset=desktop
          --collect.url='http://localhost:3000/?ff=desktop'
          --collect.url='http://localhost:3000/en?ff=desktop'
          --collect.url='http://localhost:3000/store/ci-fixture-product?ff=desktop'
          --collect.url='http://localhost:3000/collections/ci-fixture-category?ff=desktop'
          --collect.url='http://localhost:3000/cart?add=ci-fixture-variant-1&ff=desktop'
        working-directory: apps/storefront
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The legacy database holds plaintext licence keys and Office 365 and
      # Adobe account passwords in its order notes. Nothing of that shape gets
      # committed to this repository, ever.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject legacy backup artefacts
        run: |
          # The schema's own SQL — migrations and the role scripts — lives under
          # packages/db/prisma/ and is meant to be here. Without the exclusion
          # this step fails on every run, and a check that always fails is one
          # people learn to ignore.
          if git ls-files | grep -v '^packages/db/prisma/' | grep -Ei '(^Old Website/|\.sql$|\.sql\.gz$|\.tar\.gz$|\.wpress$)'; then
            echo "::error::Legacy backup artefacts must never be committed. See .gitignore."
            exit 1
          fi
