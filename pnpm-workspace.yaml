packages:
  - 'apps/*'
  - 'packages/*'
  - 'workers/*'

# Single source of truth for dependency versions across the monorepo.
# Verified against the npm registry on 2026-09-09.
catalog:
  # --- language & tooling ---
  typescript:
    ~6.0.3 # NOT 7.x yet: TS 7 is the new native compiler and
    # NestJS leans on emitDecoratorMetadata. Revisit later.
  '@types/node': ^22.15.0
  tsx: ^4.20.0
  rimraf: ^6.0.1
  eslint: ^10.10.0
  typescript-eslint: ^8.70.0 # supports eslint 10 and typescript 6
  '@eslint/js': ^10.0.1
  globals: ^17.12.0
  prettier: ^3.6.0
  vitest: ^3.2.0

  # --- data layer ---
  prisma: ~7.10.0
  '@prisma/client': ~7.10.0
  '@prisma/adapter-pg': ~7.10.0 # Prisma 7 requires a driver adapter
  # The generated client lives outside node_modules — deliberately, so dist/ can
  # reach it by the same relative path as src/ — which means pnpm will not expose
  # this transitive dependency of @prisma/client to it. Declared explicitly.
  '@prisma/client-runtime-utils': ~7.10.0
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  dotenv: ^17.4.2
  zod: ^4.5.4

  # --- api (NestJS 12) ---
  '@nestjs/common': ^12.0.1
  '@nestjs/core': ^12.0.1
  '@nestjs/platform-fastify': ^12.0.1
  '@nestjs/config': ^12.0.0
  '@nestjs/jwt': ^12.0.1
  '@nestjs/swagger': ^12.0.1
  '@nestjs/schedule': ^12.0.1
  '@nestjs/throttler': ^6.5.0
  '@nestjs/cli': ^12.0.0
  '@nestjs/schematics': ^12.0.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  fastify: ^5.4.0
  # SwaggerModule serves its UI through this on the Fastify adapter.
  '@fastify/static': ^8.2.0
  '@fastify/cookie': ^11.1.2 # httpOnly session cookies
  nestjs-pino: ^5.1.0
  pino: ^10.3.1
  pino-pretty: ^13.1.0

  # --- storefront & admin (Next 16 / React 19) ---
  next: ^16.3.4
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  next-intl: ^4.14.2
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  postcss: ^8.5.6

  # --- jobs, cache, search ---
  bullmq: ^6.3.4
  ioredis: ^6.0.0
  meilisearch: ^0.62.0

  # --- payments, crypto, mail ---
  stripe: ^22.6.1
  argon2: ^0.45.1
  otplib: ^13.5.0
  qrcode: ^1.5.4
  '@types/qrcode': ^1.5.6
  '@aws-sdk/client-kms': ^3.1128.0
  resend: ^6.26.0
  web-push: ^3.6.7
